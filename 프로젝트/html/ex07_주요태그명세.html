<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML의 주요 태그 명세</title>
</head>
<body>
    <!-- 
    1. 문단 및 제목 관련 태그
        - <p>태그 내부에블록 형태의 요소(Flow Content 내 주요 구역 태그)를 절대로 넣을 수 없습니다.
        - <h1>~<h6>태그 내부에블록 형태의 요소(Flow Content 내 주요 구역 태그)를 절대로 넣을 수 없습니다.    
    -->
    <p><div>...</div></p>  (x)
    <p><ul>...</ul></p>   (x)
    <p><h1>...</h1></p>   (x)
    <h1><div>...</div></h1>  (x)

    <!-- 
    2. 목록(List) 관련 태그
            - <ul>과 <ol>태그 내부에블록 형태의 요소(Flow Content 내 주요 구역 태그)를 절대로 넣을 수 없습니다.
    -->

    <!-- 
    3. 표(table) 관련 태그
                - <table>태그 내부에블록 형태의 요소(Flow Content 내 주요 구역 태그)를 절대로 넣을 수 없습니다.
                - <caption>, <colgroup>, <thead>, <tbody>, <tfoot>, <tr>태그 내부에블록 형태의 요소(Flow Content 내 주요 구역 태그)를 절대로 넣을 수 없습니다.
                - <td>, <th>태그 내부에블록 형태의 요소(Flow Content 내 주요 구역 태그)를 절대로 넣을 수 없습니다.    
    -->
    <table>
        <caption></caption>
        <colgroup></colgroup>
        <thead></thead>
        <tbody></tbody>
        <tfoot></tfoot>
        <tr></tr>
        <td></td>
        <th></th>
    </table>                

</body>
</html>
