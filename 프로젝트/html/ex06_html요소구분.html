<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 요소 구분</title>
    <!-- Metedata -->
    <base href="">
    <link rel="stylesheet" href="">
    <meta>
    <noscript>
        <p>자바스크립트가 꺼져있습니다.</p>
        <p>이 사이트를 이용하려면 자바스크립트를 활성화 해주세요.</p>
    </noscript>
    <script>//내부 자바스크립트 작성</script>
    <style>/* 내부 스타일시트 작성 */</style>
    <template></template>
    <title>HTML 요소 구분</title>
</head>
<body>
    <h1>콘텐츠 카테고리</h1>
    <!-- Flow  -->
    <h2>Flow</h2>
    <!-- Metadata  -->
    <h2>Metadata</h2>
    <p>메타데이터 관련 요소는 head 사이에 쓴다.</p>
    <!-- Heading -->
    <h2>Heading</h2>
    <hgroup>
        <h1>큰 제목: 상단 로고, 본문 전체 제목</h1>
        <h2>중간 제목: 섹션 제목</h2>
        <h3>작은 제목</h3>
        <h4>더 작은 제목</h4>
        <h5>더더 작은 제목</h5>
        <h6>가장 작은 제목</h6>
    </hgroup>

    <!-- Embedded -->
    <h2>Embedded</h2>
    <img src="경로/파일명" alt="대체테스트">
    <video src="경로/파일명"></video>
    <video>
        <source src="경로/파일명" type="video/mp4">
        <source src="경로/파일명" type="video/webm">
        <source src="경로/파일명" type="video/ogg">
        비디오 재생을 지원하지 않는 브라우저입니다.
    </video>
    <audio src="경로/파일명" controls></audio>
    <audio controls>
        <source src="경로/파일명" type="audio/mpeg">
        <source src="경로/파일명" type="audio/wav">
        <source src="경로/파일명" type="audio/ogg">
        오디오 재생을 지원하지 않는 브라우저입니다.
    </audio>
    <iframe src=""></iframe>
    <picture>

        <!-- 992px 보다 크면(데스크탑pc용.png) 사용 -->
        <source media="(max-width: 768px)" srcset="테블릿.png">
        <!-- 992px 보다 작으면(mobile용.png) 사용 -->
        <source media="(min-width: 992px)" srcset="pc용.png">
        <!-- 그렇지 않으면 폰.png를 출력 -->
        <img src="폰.png" alt="프로필 이미지">
    </picture>
    <canvas></canvas>
    <svg></svg>
    <object data="" type></object>
    <embed src="" type="">
        

    <!-- Interactive -->
    <h2>Interactive</h2>
    <!-- Phrasing -->
    <h2>Phrasing</h2>
    <!-- Sectioning -->
    <h2>Sectioning</h2>
</body>
</html>
